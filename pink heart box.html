<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A for M</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Ma+Shan+Zheng&display=swap');

:root {
  --night: #12090f;
  --pink: #e8607a;
  --pink-light: #f4a0b0;
  --pink-pale: #fce8ee;
  --purple: #5a3a6e;
  --silk: #8060a8;
  --silk-light: #c4a8d8;
  --silk-shine: #e8d8f4;
  --gold: #c8a060;
  --text: #2a1520;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--night);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  overflow: hidden;
  position: relative;
}

/* ── BACKGROUND DUST ── */
canvas#dust {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.4;
}

/* ── STAGE ── */
#stage {
  position: relative;
  width: 320px;
  height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── BOX CONTAINER ── */
#box-wrap {
  position: relative;
  width: 220px;
  height: 220px;
  cursor: pointer;
}

/* breathing glow */
#box-wrap::before {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,96,122,0.2) 0%, transparent 70%);
  animation: breathe 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes breathe {
  0%,100% { transform: scale(0.95); opacity: 0.6; }
  50% { transform: scale(1.05); opacity: 1; }
}

/* ── HEART BOX SVG ── */
#box-svg {
  width: 220px;
  height: 220px;
  filter: drop-shadow(0 8px 24px rgba(232,96,122,0.4));
  animation: float 4s ease-in-out infinite;
  transition: filter 0.3s;
}
#box-wrap:hover #box-svg {
  filter: drop-shadow(0 12px 32px rgba(232,96,122,0.7));
}
@keyframes float {
  0%,100% { transform: translateY(0px) rotate(-1deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
}

/* lid flap */
#box-lid {
  transform-origin: top center;
  transform: rotateX(0deg);
  transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-box: fill-box;
}
#box-wrap.opened #box-lid {
  transform: rotateX(-140deg);
}
#box-wrap.opened #box-svg {
  animation: none;
  filter: drop-shadow(0 4px 16px rgba(232,96,122,0.3));
}
#box-wrap.opened::before { animation: none; opacity: 0; }

/* ── SILK INTERIOR ── */
#silk-interior {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -40%);
  width: 160px;
  height: 120px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease 0.4s;
  overflow: hidden;
}
#box-wrap.opened #silk-interior {
  opacity: 1;
}

.silk-layer {
  position: absolute;
  inset: 0;
  border-radius: 4px;
}
.silk-1 {
  background: linear-gradient(135deg,
    #7a50a0 0%, #9060c0 20%, #c4a0e0 35%,
    #8050b0 50%, #b090d0 65%, #6a40a0 80%, #a070c0 100%);
}
.silk-2 {
  background: repeating-linear-gradient(
    45deg,
    transparent 0px, transparent 3px,
    rgba(255,255,255,0.08) 3px, rgba(255,255,255,0.08) 4px
  );
}
.silk-shine-bar {
  position: absolute;
  top: 10%; left: 15%;
  width: 30%; height: 60%;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
  border-radius: 2px;
  animation: shineMove 3s ease-in-out infinite;
}
@keyframes shineMove {
  0%,100% { opacity: 0.6; transform: translateX(0); }
  50% { opacity: 1; transform: translateX(10px); }
}

/* ── LABEL ── */
#label {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%) rotate(-2deg);
  background: var(--pink-pale);
  padding: 4px 12px;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 0.9rem;
  color: var(--purple);
  letter-spacing: 0.1em;
  opacity: 0;
  transition: opacity 0.5s ease 0.8s;
  white-space: nowrap;
  border: 1px solid rgba(90,58,110,0.2);
}
#box-wrap.opened #label { opacity: 1; }

/* ── HINT TEXT ── */
#hint {
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.68rem;
  letter-spacing: 0.25em;
  color: rgba(232,96,122,0.5);
  white-space: nowrap;
  animation: pulse 2.5s ease infinite;
}
#box-wrap.opened #hint {
  opacity: 0;
  visibility: hidden;
  animation: none;
  transition: opacity 0.2s, visibility 0s 0.2s;
}

/* ── QUOTE PANEL ── */
#quote-panel {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  padding: 20px;
  text-align: center;
  z-index: 50;          /* ← 加这一行 */
}
#quote-panel.show {
  opacity: 1;
}

#stage.revealed #box-wrap {
  transform: translateY(-60px) scale(0.75);
  transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#stage:not(.revealed) #box-wrap {
  transition: transform 0.8s ease;
}

/* 单句控制：默认隐藏，.active 时显示 */
.quote-line {
  font-size: 0.88rem;
  line-height: 2;
  color: #f0e6f6;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
.quote-line.arthur {
  color: var(--gold);
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 1rem;
  letter-spacing: 0.05em;
}
.quote-line.merlin {
  color: #d4c0f0;
  font-size: 0.82rem;
  font-style: italic;
}
.quote-line.narrator {
  color: #e8dcf8;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  margin-top: 8px;
}



/* 手动激活样式（优先级高于 nth-child） */
#quote-panel.show .quote-line.active {
  opacity: 1;
  transform: none;
  transition-delay: 0s !important;  /* 立即显示 */
}

/* silk swatch in quote */
.silk-swatch {
  display: inline-block;
  width: 32px; height: 14px;
  background: linear-gradient(90deg, #7a50a0, #c4a0e0, #7a50a0);
  border-radius: 2px;
  vertical-align: middle;
  margin: 0 4px;
  box-shadow: 0 1px 4px rgba(90,58,110,0.4);
}

/* ── RESET ── */
#reset-btn {
  position: fixed;
  bottom: 32px;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: rgba(232,96,122,0.25);
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.3s;
  display: none;
}
#reset-btn:hover { color: rgba(232,96,122,0.6); }
#reset-btn.show { display: block; }

/* ── SPARKLES ── */
.sparkle {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--silk-light);
  border-radius: 50%;
  pointer-events: none;
  animation: sparkle-fly 1s ease forwards;
}
@keyframes sparkle-fly {
  0% { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

/* ── 眼睛与可下滑的丝绸遮罩 ── */
#eye-area {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 10;
}
#eye-area.show {
  opacity: 1;
}
#eye-area .eyes {
  font-size: 2.4rem;
  letter-spacing: 6px;
  filter: hue-rotate(185deg) saturate(0.8) brightness(1.4) opacity(0.10);
}

/* 丝绸遮罩，覆盖在眼睛上方 */
#silk-veil {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 160px;
  height: 140px;
  transform: translate(-50%, -65%);
  background: linear-gradient(135deg,
    #7a50a0 0%, #9060c0 20%, #c4a0e0 35%,
    #8050b0 50%, #b090d0 65%, #6a40a0 80%, #a070c0 100%);
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  box-shadow: 0 4px 12px rgba(90,58,110,0.3);
}
#silk-veil.show {
  opacity: 1;
  pointer-events: auto;
  cursor: pointer;
}
/* 下滑动画 */
#silk-veil.slide-down {
  transform: translate(-50%, 80%);
  opacity: 0.7;
  pointer-events: none;
}

/* 点击丝绸的提示 */
#silk-hint {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: rgba(200,168,216,0.6);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
#silk-hint.show {
  opacity: 1;
}
</style>
</head>
<body>

<canvas id="dust"></canvas>

<div id="stage">
  <div id="box-wrap" onclick="openBox()">

    <!-- Heart Box SVG -->
    <svg id="box-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f07090"/>
          <stop offset="50%" stop-color="#e8607a"/>
          <stop offset="100%" stop-color="#c84060"/>
        </linearGradient>
        <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8a0b8"/>
          <stop offset="100%" stop-color="#e8607a"/>
        </linearGradient>
        <linearGradient id="shineGrad" x1="0%" y1="0%" x2="60%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
      </defs>

      <!-- BOX BODY (bottom heart) -->
      <g transform="translate(110,130)">
        <path d="M0,-55 C8,-70 30,-70 30,-50 C30,-30 0,0 0,0 C0,0 -30,-30 -30,-50 C-30,-70 -8,-70 0,-55 Z"
              fill="url(#boxGrad)" transform="scale(1.6,1.5) translate(0,10)"/>
        <path d="M-20,-55 C-10,-68 10,-68 10,-55"
              fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"
              transform="scale(1.6,1.5) translate(0,10)"/>
      </g>

      <!-- RIBBON vertical -->
      <rect x="107" y="80" width="6" height="80" fill="rgba(255,255,255,0.2)" rx="3"/>
      <!-- RIBBON horizontal -->
      <rect x="75" y="117" width="70" height="6" fill="rgba(255,255,255,0.2)" rx="3"/>
      <!-- BOW center -->
      <ellipse cx="110" cy="120" rx="7" ry="7" fill="rgba(255,255,255,0.35)"/>
      <!-- BOW left loop -->
      <ellipse cx="94" cy="115" rx="12" ry="7" fill="rgba(255,255,255,0.2)" transform="rotate(-20,94,115)"/>
      <!-- BOW right loop -->
      <ellipse cx="126" cy="115" rx="12" ry="7" fill="rgba(255,255,255,0.2)" transform="rotate(20,126,115)"/>

      <!-- LID (top flap) -->
      <g id="box-lid">
        <g transform="translate(110,108)">
          <path d="M0,-52 C8,-66 28,-66 28,-48 C28,-28 0,2 0,2 C0,2 -28,-28 -28,-48 C-28,-66 -8,-66 0,-52 Z"
                fill="url(#lidGrad)" transform="scale(1.55,1.4)"/>
          <path d="M-18,-52 C-8,-64 8,-64 8,-52"
                fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"
                transform="scale(1.55,1.4)"/>
          <circle cx="-8" cy="-40" r="2" fill="rgba(255,255,255,0.6)"/>
          <circle cx="14" cy="-52" r="1.5" fill="rgba(255,255,255,0.5)"/>
          <circle cx="2" cy="-62" r="1" fill="rgba(255,255,255,0.4)"/>
        </g>
      </g>
    </svg>

    <!-- Silk interior (shows when opened) -->
    <div id="silk-interior">
      <div class="silk-layer silk-1"></div>
      <div class="silk-layer silk-2"></div>
      <div class="silk-shine-bar"></div>
    </div>

    <!-- 眼睛 + 丝绸遮罩（移到了 silk-interior 外面） -->
    <div id="eye-area">
      <span class="eyes">👁️👁️</span>
    </div>
    <div id="silk-veil"></div>

    <!-- Label -->
    <div id="label">A &nbsp;for&nbsp; M</div>

    <!-- Hint -->
    <div id="hint">— 点击打开 —</div>
  </div>

  <!-- Quote panel -->
  <div id="quote-panel">
    <div id="line1" class="quote-line arthur">「就紫色吧，紫色适合他。」</div>
    <div id="line2" class="quote-line narrator">黑暗中传来亚瑟得意的声音。</div>
    <div id="line3" class="quote-line merlin" style="margin-top:-80px;">后面露出梅林幽怨的目光。</div>
    <div id="line4" class="quote-line narrator" style="margin-top:20px;">
      <span class="silk-swatch"></span>&nbsp; A &nbsp;for&nbsp; M &nbsp;<span class="silk-swatch"></span>
    </div>
  </div>
</div>
<button id="reset-btn" onclick="resetBox()">↺   重新打开</button>

<script>
  // ── DUST PARTICLES ──
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = Array.from({length: 40}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3,
    vx: (Math.random() - 0.5) * 0.2,
    vy: -Math.random() * 0.3 - 0.1,
    alpha: Math.random() * 0.4 + 0.1,
    hue: Math.random() > 0.5 ? '320,60%,70%' : '270,50%,70%'
  }));

  function drawDust() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},${p.alpha})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.y < 0) p.y = canvas.height;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
    });
    requestAnimationFrame(drawDust);
  }
  drawDust();

  // ── SOUNDS ──
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function makeRustleSound() {
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 3000;
    filter.Q.value = 0.8;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
  }

  function makePopSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  // ── SPARKLES ──
  function spawnSparkles(cx, cy) {
    const stage = document.getElementById('stage');
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const angle = (i / 12) * Math.PI * 2;
      const dist = 40 + Math.random() * 40;
      s.style.cssText = `
        left: ${cx}px; top: ${cy}px;
        --tx: ${Math.cos(angle) * dist}px;
        --ty: ${Math.sin(angle) * dist}px;
        background: ${Math.random() > 0.5 ? '#c4a8d8' : '#f4a0b0'};
        width: ${2 + Math.random() * 3}px;
        height: ${2 + Math.random() * 3}px;
      `;
      stage.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }

  // ── 交互逻辑 ──
  let opened = false;
  let silkRevealed = false;

  const boxWrap = document.getElementById('box-wrap');
  const stage = document.getElementById('stage');
  const resetBtn = document.getElementById('reset-btn');
  const silkVeil = document.getElementById('silk-veil');
  const eyeArea = document.getElementById('eye-area');
  const quotePanel = document.getElementById('quote-panel');
  const line1 = document.getElementById('line1');
  const line2 = document.getElementById('line2');
  const line3 = document.getElementById('line3');
  const line4 = document.getElementById('line4');

  // 动态添加丝绸点击提示
  const silkHint = document.createElement('div');
  silkHint.id = 'silk-hint';
  silkHint.textContent = '— 轻触丝绸 —';
  stage.appendChild(silkHint);

  function openBox() {
    if (opened) return;
    opened = true;

    audioCtx.resume().then(() => {
      makePopSound();
      setTimeout(makeRustleSound, 200);
    });

    const rect = boxWrap.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const cx = rect.left + rect.width / 2 - stageRect.left;
    const cy = rect.top + rect.height / 2 - stageRect.top;

    boxWrap.classList.add('opened');
    setTimeout(() => spawnSparkles(cx, cy), 300);
    stage.classList.add('revealed');   // ⚠️ 这一行必须存在

setTimeout(() => {
  document.getElementById('quote-panel').classList.add('show');
  line1.classList.add('active');   // ← 手动显示第一句
  line2.classList.add('active');   // ← 手动显示第二句
  eyeArea.classList.add('show');
  silkVeil.classList.add('show');
  silkHint.classList.add('show');
  silkVeil.addEventListener('click', revealEyes);
}, 900);
  }

function revealEyes() {
  if (silkRevealed) return;
  silkRevealed = true;

  audioCtx.resume().then(() => {
    makeRustleSound();
  });

  silkVeil.classList.add('slide-down');
  silkHint.classList.remove('show');

  // 让前两句淡出
  line1.classList.remove('active');
  line2.classList.remove('active');

  // 同时让第三句淡入
  setTimeout(() => {
    line3.classList.add('active');
  }, 200);  // 稍作延迟，让消失和出现的过渡更自然

  setTimeout(() => {
    resetBtn.classList.add('show');
  }, 800);
}

  function resetBox() {
    opened = false;
    silkRevealed = false;

    boxWrap.classList.remove('opened');
    stage.classList.remove('revealed');
    quotePanel.classList.remove('show');

    [line1, line2, line3, line4].forEach(el => el.classList.remove('active'));
    eyeArea.classList.remove('show');
    silkVeil.classList.remove('show', 'slide-down');
    silkHint.classList.remove('show');
    resetBtn.classList.remove('show');

    silkVeil.removeEventListener('click', revealEyes);
  }
</script>

</body>
</html>
